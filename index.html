<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>MeroNest — Nepal Property Management System</title>
    <meta name="description" content="MeroNest is a modern property management platform for Nepal. Manage properties, tenants, leases, finances, and maintenance requests in one place." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#3b82f6" />

    <!-- Canonical -->
    <link rel="canonical" href="https://meronest.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://meronest.app/" />
    <meta property="og:title" content="MeroNest — Nepal Property Management System" />
    <meta property="og:description" content="Manage properties, tenants, leases, finances, and maintenance requests in one place." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="MeroNest" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MeroNest — Nepal Property Management System" />
    <meta name="twitter:description" content="Manage properties, tenants, leases, finances, and maintenance requests in one place." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Resource Hints -->
    <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/login-bg.png" fetchpriority="low" />

    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
