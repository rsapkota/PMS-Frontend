name: meronest-frontend-ci-cd

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "Dockerfile"
      - ".github/workflows/deploy-meronest-frontend.yml"

concurrency:
  group: meronest-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=https://meronest.com
          tags: |
            ghcr.io/${{ github.repository_owner }}/meronest-frontend:latest
            ghcr.io/${{ github.repository_owner }}/meronest-frontend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy frontend source to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "./*"
          target: /root/apps/meronest/frontend
          strip_components: 1

      - name: Deploy frontend release on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            if [[ -n "${GHCR_USER:-}" && -n "${GHCR_TOKEN:-}" ]]; then
              echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            COMPOSE_FILE=/opt/apps/meronest/infra/docker/docker-compose.prod.yml
            CADDY_FILE=/opt/apps/meronest/infra/docker/Caddyfile

            # Keep frontend API base on app domain to avoid client-side api subdomain DNS cache issues.
            sudo sed -i 's#VITE_API_URL: https://${APP_API_DOMAIN}#VITE_API_URL: https://${APP_DOMAIN}#' "$COMPOSE_FILE"

            # Ensure same-origin API proxy is present on app domain.
            if ! sudo grep -q 'handle /api/\*' "$CADDY_FILE"; then
              sudo tee "$CADDY_FILE" >/dev/null <<'EOF'
{
  default_sni 209.50.241.243
  fallback_sni 209.50.241.243
}

{$APP_DOMAIN} {
  encode zstd gzip

  handle /api/* {
    reverse_proxy backend:5135
  }

  handle /health {
    reverse_proxy backend:5135
  }

  handle {
    reverse_proxy frontend:80
  }
}

www.{$APP_DOMAIN} {
  redir https://{$APP_DOMAIN}{uri} 308
}

{$APP_API_DOMAIN} {
  encode zstd gzip
  reverse_proxy backend:5135
}

{$APP_JOBS_DOMAIN} {
  encode zstd gzip
  reverse_proxy backend:5145
}

http://209.50.241.243, http://209.50.241.243:80 {
  encode zstd gzip
  reverse_proxy backend:5135
}

https://209.50.241.243, https://209.50.241.243:443 {
  tls internal
  encode zstd gzip
  reverse_proxy backend:5135
}
EOF
            fi

            sudo docker compose -f /opt/apps/meronest/infra/docker/docker-compose.prod.yml --env-file /opt/apps/meronest/infra/docker/.env build frontend
            sudo DEPLOY_ROOT=/opt/apps APP_SLUG=meronest SKIP_PULL=true SHARED_SQL_ROOT=/opt/shared/sqlserver /opt/apps/meronest/scripts/deploy_app.sh
            sudo docker compose -f /opt/apps/meronest/infra/docker/docker-compose.prod.yml --env-file /opt/apps/meronest/infra/docker/.env restart caddy
